<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silverbullet Data Miner // Auth</title>
    <style>
        :root {
            --bg-color: #030508;
            --panel-color: #0b101a;
            --text-color: #e5e7eb;
            --accent-color: #00ff66;
            --accent-dim: rgba(0, 255, 102, 0.15);
            --danger-color: #ff3366;
            --border-color: #1f2937;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
            font-family: 'Courier New', Courier, monospace;
        }

        /* Auth Screen */
        #authScreen {
            text-align: center;
            border: 1px solid var(--border-color);
            padding: 40px;
            border-radius: 8px;
            background: var(--panel-color);
        }

        input {
            padding: 10px;
            background: #000;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            margin-bottom: 10px;
            width: 200px;
            text-align: center;
        }

        button {
            background: var(--accent-color);
            color: black;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Dashboard visibility */
        #mainApp { display: none; }
        
        /* ... Keep all your previous CSS from v2.0 here ... */
    </style>
</head>
<body>

<div id="authScreen">
    <h1>SILVERBULLET GATE</h1>
    <input type="password" id="keyInput" placeholder="ENTER ACCESS KEY">
    <br>
    <button onclick="checkAuth()">AUTHENTICATE</button>
</div>

<div id="mainApp" class="container">
    </div>

<script>
    function checkAuth() {
        const key = document.getElementById('keyInput').value;
        if (key === "SVB001") {
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
        } else {
            alert("ACCESS DENIED");
        }
    }
    
    // ... Paste your v2.0 JS logic here ...
</script>

</body>
</html>
